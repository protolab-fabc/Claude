# Déploie le hub et les samples sur GitHub Pages à chaque push sur la branche par défaut.
name: Déployer sur GitHub Pages

on:
  push:
    branches: [claude/add-emilkowalski-skill-mpubsw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Seuls le hub et les samples sont publiés, pas les skills ni la configuration.
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html .nojekyll _site/
          cp -r samples _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
